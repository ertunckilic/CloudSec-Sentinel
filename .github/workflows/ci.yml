name: CloudSec Sentinel CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Python 3.12 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Bagimliliklari Yukle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx bandit

    - name: SAST Guvenlik Taramasi (Bandit)
      run: |
        bandit -r . -x .venv,venv -s B101

    - name: Otomatik Testleri Calistir
      env:
        ADMIN_USER: admin
        ADMIN_PASS: Sentinel2026!
      run: |
        pytest
