name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-quality:
    name: Code Quality & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit bandit

      - name: Run Pre-Commit Hooks (Formatting & Linting)
        run: pre-commit run --all-files

      - name: Run Bandit SAST Security Scan
        run: bandit -r . -ll -ii -x ./.venv,./tests

  unit-tests:
    name: Automated Unit Testing
    runs-on: ubuntu-latest
    needs: security-and-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Pytest Suite
        run: pytest test_api.py --cov=. --cov-report=xml

  docker-build-verification:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Enterprise Docker Image
        run: docker build -t cloudsec-sentinel:enterprise-validation .
